name: Build and Test

on:
  workflow_call:
    inputs:
      java:
        required: false
        type: string
        default: 17
      branch:
        required: false
        type: string
        description: Branch to run the build against
        default: trunk
      os:
        required: false
        type: string
        description: Operating system to run the build on
        default: ubuntu_24
      jobs:
        required: true
        type: string
        description: >-
          Jobs to run, and should be in JSON Array format.
          Candidates: "build-only".
        default: '[]'

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  MAVEN_ARGS:
    --batch-mode
    --no-transfer-progress
    -Pyarn-ui
    -Pnative
    -Drequire.test.libhadoop
    -Drequire.fuse
    -Drequire.openssl
    -Drequire.snappy
    -Drequire.valgrind
    -Dmaven.test.failure.ignore=false

jobs:
  precondition:
    name: Preparation
    runs-on: ubuntu-24.04
    outputs:
      infra_image_url: ${{ steps.variables.outputs.infra_image_url }}
    steps:
      - name: Set up Outputs
        id: variables
        run: |
          echo "infra_image_url=ghcr.io/${{ github.repository }}/hadoop/gha-${{ inputs.os }}:${{ inputs.branch }}-${{ github.run_id }}" >> $GITHUB_OUTPUT
  infra-image:
    name: Infra Image ${{ inputs.os }}-${{ inputs.branch }}
    runs-on: ubuntu-24.04
    needs: [ precondition ]
    permissions:
      packages: write
    outputs:
      uid: ${{ steps.variables.outputs.uid }}
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout Hadoop repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          repository: apache/hadoop
          ref: ${{ inputs.branch }}
      - name: Sync the current branch with the latest in Apache Hadoop
        if: github.repository != 'apache/hadoop'
        run: |
          echo "APACHE_HADOOP_REF=$(git rev-parse HEAD)" >> $GITHUB_ENV
          git fetch https://github.com/$GITHUB_REPOSITORY.git ${GITHUB_REF#refs/heads/}
          git -c user.name='Apache Hadoop GitHub Actions Account' -c user.email='hadoop.gha@github.com' merge --no-commit --progress --squash FETCH_HEAD
          git -c user.name='Apache Hadoop GitHub Actions Account' -c user.email='hadoop.gha@github.com' commit -m "Merged commit" --allow-empty
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build and push ${{ inputs.os }} base infra image for ${{ inputs.branch }}
        id: docker_build_base
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ./dev-support/docker/
          file: ./dev-support/docker/Dockerfile_${{ inputs.os }}
          push: true
          tags: ${{ needs.precondition.outputs.infra_image_url }}-base
      - name: User-specific Dockerfile
        run: |
          USER_ID=$(id -u "${USER}")
          GROUP_ID=$(id -g "${USER}")
          cat > /tmp/Dockerfile.gha <<UserSpecificDocker
          FROM ${{ needs.precondition.outputs.infra_image_url }}-base
          RUN rm -f /var/log/faillog /var/log/lastlog
          RUN groupadd --non-unique -g ${GROUP_ID} ${USER}
          RUN useradd -g ${GROUP_ID} -u ${USER_ID} -k /root -m ${USER}
          RUN echo "${USER} ALL=NOPASSWD: ALL" > "/etc/sudoers.d/hadoop-build-${USER_ID}"
          UserSpecificDocker
      - name: Build and push ${{ inputs.os }} infra image for ${{ inputs.branch }}
        id: docker_build_gha
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ./dev-support/docker/
          file: /tmp/Dockerfile.gha
          push: true
          tags: ${{ needs.precondition.outputs.infra_image_url }}
      - name: Set up Outputs
        id: variables
        run: |
          echo "uid=$(id -u "${USER}")" >> $GITHUB_OUTPUT
  build-only:
    name: Build Only (Java ${{ inputs.java }}) ${{ inputs.os }}-${{ inputs.branch }}
    if: (!cancelled()) && contains(fromJSON(inputs.jobs), 'build-only')
    runs-on: ubuntu-24.04
    needs: [ precondition, infra-image ]
    container:
      image: ${{ needs.precondition.outputs.infra_image_url }}
      options: --user ${{ needs.infra-image.outputs.uid }}
    steps:
      - name: Checkout Hadoop repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          repository: apache/hadoop
          ref: ${{ inputs.branch }}
      - name: Sync the current branch with the latest in Apache Hadoop
        if: github.repository != 'apache/hadoop'
        run: |
          echo "APACHE_HADOOP_REF=$(git rev-parse HEAD)" >> $GITHUB_ENV
          git fetch https://github.com/$GITHUB_REPOSITORY.git ${GITHUB_REF#refs/heads/}
          git -c user.name='Apache Hadoop GitHub Actions Account' -c user.email='hadoop.gha@github.com' merge --no-commit --progress --squash FETCH_HEAD
          git -c user.name='Apache Hadoop GitHub Actions Account' -c user.email='hadoop.gha@github.com' commit -m "Merged commit" --allow-empty
      - name: Setup JDK ${{ inputs.java }}
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ inputs.java }}
          cache: 'maven'
          check-latest: false
      - name: Build
        shell: bash
        run: ./mvnw $MAVEN_ARGS clean install -DskipTests
